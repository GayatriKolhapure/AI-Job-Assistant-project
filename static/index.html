<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CareerPilot · AI Job Assistant</title>
    <style>
      :root {
        --bg: #f3f4fb;
        --card: #fff;
        --text: #1e1b3a;
        --muted: #6b7090;
        --line: #e6e8f2;
        --bot: #fff;
        --accent: #6d5efc;
        --accent2: #22d3ee;
        --ok: #16a34a;
        --shadow: 0 8px 30px rgba(60, 50, 150, 0.1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0f1a;
          --card: #171829;
          --text: #ecebff;
          --muted: #9a9cc0;
          --line: #27294a;
          --bot: #1b1d33;
          --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            900px 500px at 10% -10%,
            rgba(109, 94, 252, 0.18),
            transparent
          ),
          radial-gradient(
            800px 500px at 100% 0,
            rgba(34, 211, 238, 0.15),
            transparent
          ),
          var(--bg);
        display: flex;
        justify-content: center;
        height: 100vh;
      }
      #app {
        width: 100%;
        max-width: 820px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
      }
      .logo {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: grid;
        place-items: center;
        font-size: 20px;
        box-shadow: var(--shadow);
      }
      header h1 {
        font-size: 17px;
        margin: 0;
      }
      header p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }
      .dot {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.2);
      }
      #log {
        flex: 1;
        overflow: auto;
        padding: 8px 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        scroll-behavior: smooth;
      }
      .row {
        display: flex;
        gap: 10px;
        animation: in 0.25s ease;
      }
      .row.u {
        justify-content: flex-end;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .av {
        width: 30px;
        height: 30px;
        border-radius: 10px;
        flex: none;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: grid;
        place-items: center;
        font-size: 14px;
      }
      .msg {
        max-width: 84%;
        padding: 11px 15px;
        border-radius: 16px;
        line-height: 1.5;
        font-size: 14.5px;
        box-shadow: var(--shadow);
      }
      .u .msg {
        background: linear-gradient(135deg, var(--accent), #8b5cf6);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .b .msg {
        background: var(--bot);
        border: 1px solid var(--line);
        border-top-left-radius: 4px;
      }
      .msg p {
        margin: 0 0 8px;
      }
      .msg p:last-child {
        margin: 0;
      }
      .msg a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }
      .typing span {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin: 0 2px;
        border-radius: 50%;
        background: var(--muted);
        animation: bl 1.2s infinite;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes bl {
        0%,
        60%,
        100% {
          opacity: 0.3;
          transform: translateY(0);
        }
        30% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
      .rcard {
        display: grid;
        gap: 8px;
      }
      .rcard h3 {
        margin: 0;
        font-size: 16px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        font-size: 12px;
        padding: 3px 10px;
        border-radius: 99px;
        background: rgba(109, 94, 252, 0.12);
        color: var(--accent);
        font-weight: 600;
      }
      .kv {
        font-size: 13px;
        color: var(--muted);
      }
      .kv b {
        color: var(--text);
      }
      .jobs {
        display: grid;
        gap: 10px;
        width: 100%;
      }
      .job {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        box-shadow: var(--shadow);
        transition: 0.15s;
      }
      .job:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
      }
      .job h4 {
        margin: 0 0 2px;
        font-size: 15px;
      }
      .job .co {
        font-size: 13px;
        color: var(--muted);
      }
      .why {
        font-size: 13px;
        margin: 8px 0;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(34, 211, 238, 0.1);
        border-left: 3px solid var(--accent2);
      }
      .acts {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), #8b5cf6);
        color: #fff;
        text-decoration: none;
      }
      .btn.ghost {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--line);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .app {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px dashed var(--line);
        font-size: 13.5px;
      }
      .app:last-child {
        border: 0;
      }
      .st {
        color: var(--ok);
        font-weight: 700;
      }
      .err {
        color: #e11d48;
      }
      footer {
        padding: 10px 20px 18px;
      }
      #sug {
        display: flex;
        gap: 8px;
        overflow: auto;
        padding-bottom: 10px;
      }
      #sug button {
        white-space: nowrap;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        border-radius: 99px;
        padding: 7px 13px;
        font-size: 13px;
        cursor: pointer;
      }
      #sug button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 8px;
        box-shadow: var(--shadow);
      }
      #bar:focus-within {
        border-color: var(--accent);
      }
      #t {
        flex: 1;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font-size: 15px;
        padding: 8px;
      }
      .ic {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        cursor: pointer;
        background: rgba(109, 94, 252, 0.12);
        font-size: 18px;
        border: 0;
      }
      #s {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        border: 0;
        cursor: pointer;
        color: #fff;
        font-size: 18px;
        background: linear-gradient(135deg, var(--accent), #8b5cf6);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="logo">🚀</div>
        <div>
          <h1>CareerPilot</h1>
          <p>Upload resume · Get matched · Apply in chat</p>
        </div>
        <div class="dot"><i></i>Online</div>
      </header>
      <div id="log"></div>
      <footer>
        <div id="sug"></div>
        <div id="bar">
          <label class="ic" title="Upload resume (PDF/DOCX)"
            >📎<input id="f" type="file" accept=".pdf,.docx" hidden
          /></label>
          <input
            id="t"
            placeholder="Message CareerPilot…"
            autocomplete="off"
          /><button id="s" title="Send">➤</button>
        </div>
      </footer>
    </div>
    <script>
      const sid = localStorage.sid || (localStorage.sid = crypto.randomUUID()),
        H = { "X-Session": sid },
        log = document.getElementById("log"),
        T = document.getElementById("t");
      const esc = (s) =>
        String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      const inl = (s) =>
        esc(s)
          .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
          .replace(/(^|\s)_(.+?)_/g, "$1<i>$2</i>")
          .replace(
            /\[(.+?)\]\((https?:[^)\s]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener">$1</a>',
          );
      const JOB =
        /^\*\*#(\d+) (.+?)\*\* — (.+?) \((.*)\)\n_Why:_ (.*)\n\[View\]\((.+?)\)$/s;
      function render(text) {
        return text
          .split("\n\n")
          .map((b) => {
            const m = b.match(JOB);
            if (m)
              return `<div class="job"><h4>#${m[1]} · ${esc(m[2])}</h4><div class="co">🏢 ${esc(m[3])} &nbsp;·&nbsp; 📍 ${esc(m[4])}</div><div class="why">💡 ${esc(m[5])}</div><div class="acts"><button class="btn" data-apply="${m[1]}">Apply</button><a class="btn ghost" href="${esc(m[6])}" target="_blank" rel="noopener">View posting ↗</a></div></div>`;
            if (/^- #\d+/.test(b))
              return b
                .split("\n")
                .map((l) => {
                  const x = l.match(
                    /^- #(\d+) (.+?) @ (.+?) — (.+?) \((.+?)\)$/,
                  );
                  return x
                    ? `<div class="app"><span><b>#${x[1]}</b> ${esc(x[2])} <span style="color:var(--muted)">@ ${esc(x[3])}</span></span><span><span class="st">${esc(x[4])}</span> · ${esc(x[5])}</span></div>`
                    : "";
                })
                .join("");
            return `<p class="${b.startsWith("⚠️") ? "err" : ""}">${inl(b).replace(/\n/g, "<br>")}</p>`;
          })
          .join("");
      }
      function add(who, html, raw) {
        const r = document.createElement("div");
        r.className = "row " + who;
        r.innerHTML =
          (who === "b" ? '<div class="av">🤖</div>' : "") +
          `<div class="msg">${html}</div>`;
        if (who === "b" && raw && raw.includes("**#")) {
          r.querySelector(".msg").style.cssText =
            "background:none;border:0;box-shadow:none;padding:0;max-width:100%;width:100%";
        }
        log.appendChild(r);
        log.scrollTop = log.scrollHeight;
        return r.querySelector(".msg");
      }
      const typing = () =>
        add(
          "b",
          '<div class="typing"><span></span><span></span><span></span></div>',
        );
      function bot(text) {
        const w = document.createElement("div");
        w.style.cssText = "display:grid;gap:10px;width:100%";
        const parts = text.split("\n\n"),
          intro = [],
          jobs = [],
          tail = [];
        parts.forEach((p) =>
          JOB.test(p) ? jobs.push(p) : (jobs.length ? tail : intro).push(p),
        );
        if (!jobs.length) return add("b", render(text));
        if (intro.length) add("b", render(intro.join("\n\n")));
        const m = add(
          "b",
          `<div class="jobs">${render(jobs.join("\n\n"))}</div>`,
          "**#",
        );
        if (tail.length) add("b", render(tail.join("\n\n")));
      }
      async function send(v) {
        v = (v ?? T.value).trim();
        if (!v) return;
        T.value = "";
        add("u", esc(v));
        const t = typing();
        try {
          const r = await fetch("/api/chat", {
            method: "POST",
            headers: { ...H, "Content-Type": "application/json" },
            body: JSON.stringify({ message: v }),
          });
          const d = await r.json();
          t.closest(".row").remove();
          bot(d.reply || d.error || "Something went wrong.");
        } catch (e) {
          t.closest(".row").remove();
          add("b", '<p class="err">⚠️ Network error. Please try again.</p>');
        }
      }
      log.addEventListener("click", (e) => {
        const b = e.target.closest("[data-apply]");
        if (!b) return;
        b.disabled = true;
        b.textContent = "Applying…";
        send("apply to job " + b.dataset.apply).then(
          () => (b.textContent = "Sent ✓"),
        );
      });
      const sug = document.getElementById("sug");
      function chips(list) {
        sug.innerHTML = "";
        list.forEach((x) => {
          const b = document.createElement("button");
          b.textContent = x;
          b.onclick = () => send(x);
          sug.appendChild(b);
        });
      }
      document.getElementById("s").onclick = () => send();
      T.onkeydown = (e) => e.key === "Enter" && send();
      document.getElementById("f").onchange = async (e) => {
        const fl = e.target.files[0];
        if (!fl) return;
        add("u", "📄 " + esc(fl.name));
        const t = typing();
        const fd = new FormData();
        fd.append("file", fl);
        try {
          const r = await fetch("/api/upload", {
            method: "POST",
            headers: H,
            body: fd,
          });
          const d = await r.json();
          t.closest(".row").remove();
          if (d.error) {
            add("b", `<p class="err">⚠️ ${esc(d.error)}</p>`);
            return;
          }
          const x = d.resume,
            c = (a) =>
              a && a.length
                ? a.map((i) => `<span class="chip">${esc(i)}</span>`).join("")
                : "—";
          add(
            "b",
            `<div class="rcard"><h3>✅ Resume parsed</h3><div class="kv"><b>${esc(x.name)}</b> · ${esc(x.designation || "Designation not found")} · ${x.experience_years} yrs</div>
<div class="kv">✉️ ${esc(x.email || "—")} &nbsp; 📞 ${esc(x.phone || "—")}</div><div class="kv"><b>Skills</b></div><div class="chips">${c(x.skills)}</div>
<div class="kv"><b>Education</b><br>${(x.education || []).map(esc).join("<br>") || "—"}</div><div class="kv"><b>Projects</b><br>${(x.projects || []).map(esc).join("<br>") || "—"}</div></div>`,
          );
          chips([
            "Only remote roles",
            "Jobs needing React",
            "Jobs needing Python",
            "Show my applied jobs",
          ]);
          send("recommend jobs for me");
        } catch (err) {
          t.closest(".row").remove();
          add("b", '<p class="err">⚠️ Upload failed. Please try again.</p>');
        }
        e.target.value = "";
      };
      add(
        "b",
        "<p>👋 Hi, I'm <b>CareerPilot</b>. Upload your resume with 📎 and I'll find jobs that fit you.</p>",
      );
      chips(["How does this work?", "Show my applied jobs"]);
    </script>
  </body>
</html>
